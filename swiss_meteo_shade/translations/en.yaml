configuration:
  easting:
    name: Easting (LV95)
    description: "Your location's east coordinate in the Swiss LV95 system. Read it off map.geo.admin.ch by right-clicking your building (the CH1903+/LV95 line, first number). Example 2665512."
  northing:
    name: Northing (LV95)
    description: "Your location's north coordinate in LV95 (second number from map.geo.admin.ch). Example 1211882."
  plz:
    name: Postcode
    description: "Your Swiss postcode, used by the app forecast fallback. Example 6006. A few postcodes carry no app data at all - the add-on checks yours at startup and logs a warning if so; pick a neighbouring postcode in that case."
  gust_limit_kmh:
    name: Gust limit (km/h)
    description: "Retract the awning when the forecast gust reaches or exceeds this speed. 40 is a cautious default; raise it if the awning tolerates more wind."
  gust_release_kmh:
    name: Gust release (km/h) - hysteresis
    description: "Once retracted for wind, stay retracted until the gust drops below this value, then re-extend. Prevents flapping near the limit. Set 0 to disable hysteresis (re-extends as soon as gust falls below the gust limit). Must be at or below the gust limit."
  min_temp_c:
    name: Minimum temperature (deg C)
    description: "Do not deploy any shade when the forecast temperature is below this value. Enter 0 to block below exactly 0 C; a negative value is allowed. Leave EMPTY to disable the temperature gate entirely (empty means off, not 0)."
  openmeteo_mode:
    name: Open-Meteo ICON gust mode
    description: "When to add Open-Meteo's ICON-CH1 model (1-2 km grid) as a gust source, alongside MeteoSwiss. 'always': every cycle, and the gust used is the maximum of the two (can only raise caution, never lower it) -- the default. 'fallback_only': only when the MeteoSwiss official/app gust is unavailable that cycle. 'never': disable it entirely."
  prefer_app_forecast:
    name: Prefer app forecast
    description: "Try the MeteoSwiss app's (unofficial, fresher) forecast before the official open-data source. Off by default for durability."
  lookahead_hours:
    name: Look-ahead window (hours)
    description: "How many hours ahead the gust and sunshine outlook considers. 1 reacts only to the current hour and the very next; increase for earlier warning of a forecast gust, at the cost of retracting further in advance of an hour that may turn out to be a forecast miss."
  sun_model:
    name: Sun model
    description: "How 'is it sunny enough' is judged. 'sunshine': forecast minutes of sunshine per hour - simple, but blind to intensity. 'irradiance': computed solar power on the surface in W/m2 from the MeteoSwiss radiation forecast - distinguishes hazy from blazing sun and correctly rates a low winter sun on a vertical blind. Each model uses its own set of thresholds below; the other set is ignored. If the radiation forecast is unavailable the add-on falls back to the sunshine model for that cycle and says so on the Sun model sensor and in a warning."
  sun_min_awning:
    name: Awning sunshine threshold (min/hour)
    description: "Minutes of sun per hour (peak in the look-ahead window) required before the awning extends. 20 = a mostly-sunny hour. Raise for stronger sun only, lower to extend on hazier spells. Drives the Awning extend and Sun expected sensors."
  sun_min_backup:
    name: Backup-blind sunshine threshold (min/hour)
    description: "Sunshine threshold for closing the backup blind (the awning's substitute when it is too windy or wet). Independent of the awning threshold. 20 default."
  sun_min_independent:
    name: Independent-blind sunshine threshold (min/hour)
    description: "Sunshine threshold for the independent blinds, which have no wind or rain vulnerability. Often set lower than the awning (e.g. 5-10) so interior glare/heat blinds come down even in weaker sun. 20 default."
  irradiance_min_shade:
    name: Shade irradiance threshold (W/m2)
    description: "Only used when Sun model is 'irradiance'. Solar power arriving on the WINDOW at or above which the opening gets shaded - by the awning when the sun is high enough for it to help, otherwise by the backup blind. What matters is sun entering the room, not sun landing on the awning fabric. For scale: overcast is roughly 100-200, hazy sun 300-500, full clear sun 700-1000. 250 is a starting point and wants tuning against how the room actually feels."
  irradiance_min_independent:
    name: Independent-blind irradiance threshold (W/m2)
    description: "Only used when Sun model is 'irradiance'. Threshold for the independent blinds, judged on the same window plane. Often set lower than the awning so interior glare blinds come down in weaker sun."
  albedo:
    name: Ground albedo
    description: "Only used when Sun model is 'irradiance'. How much light the ground reflects back onto a vertical surface, which sees as much ground as sky. Fresh snow 0.75, old snow 0.45, gravel or concrete terrace 0.30, grass 0.20, dark asphalt 0.10. Over snow this alone can add 200 W/m2 to a blind."
  min_solar_elevation:
    name: Minimum solar elevation (degrees)
    description: "Only used when Sun model is 'irradiance'. Below this sun height the direct beam is ignored. This is a SITE HORIZON setting: raise it to match whatever actually blocks your low sun - a treeline, neighbouring buildings, a slope - typically 5 to 15. With a clear horizon, 0 is perfectly safe and is the right choice: near the horizon MeteoSwiss already reports the radiation as 90-100% diffuse, so the direct beam is essentially zero anyway and the setting changes nothing."
  irradiance_substeps:
    name: Irradiance sub-steps per hour
    description: "Only used when Sun model is 'irradiance'. How finely the sun's path is sampled within each forecast hour. 12 (every 5 minutes) is ample; raising it costs nothing but changes almost nothing. Rarely worth touching."
  radar_threshold_mmh:
    name: Rain threshold (mm/h)
    description: "Rain rate at or above which the radar counts a cell as rain. 0.1 catches light drizzle; raise it to ignore very light precipitation."
  radar_tolerance_km:
    name: Radar tolerance (km)
    description: "How far around your exact cell the radar looks when projecting rain forward. 1 km is a sensible default."
  radar_fail_safe:
    name: Radar fail-safe
    description: "If the radar service is unreachable, treat it as rain and retract, rather than assuming dry. Turn on in high-exposure spots where a missed shower is costly."
  interval_seconds:
    name: Update interval (seconds)
    description: "How often to fetch data and republish. 300 (5 min) matches the radar cadence. Raise it on a metered connection."
  forecast_max_cache_minutes:
    name: Forecast cache ceiling (minutes)
    description: "Force a full forecast re-download after this long even if the server reports it unchanged - an independent freshness net on top of the per-cycle conditional request. 60 is fine. Set 0 to never force (rely on the conditional request alone)."
