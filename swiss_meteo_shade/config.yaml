name: Swiss Meteo Shade
version: "1.4.0"
slug: swiss_meteo_shade
description: Weather-driven awning & blind automation from MeteoSwiss open data (Switzerland only)
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
services:
  - mqtt:need
options:
  easting: 2665512.66
  northing: 1211882.47
  plz: "6006"
  gust_limit_kmh: 40
  gust_release_kmh: 0
  min_temp_c: ""
  openmeteo_mode: always
  prefer_app_forecast: false
  lookahead_hours: 1
  sun_model: sunshine
  sun_min_awning: 20
  sun_min_backup: 20
  sun_min_independent: 20
  irradiance_min_awning: 250
  irradiance_min_backup: 250
  irradiance_min_independent: 250
  awning_tilt: 45
  albedo: 0.20
  min_solar_elevation: 3.0
  irradiance_substeps: 12
  radar_threshold_mmh: 0.1
  radar_tolerance_km: 1
  radar_fail_safe: false
  interval_seconds: 300
  forecast_max_cache_minutes: 60
schema:
  easting: float
  northing: float
  plz: str
  gust_limit_kmh: float
  gust_release_kmh: float
  min_temp_c: str?
  openmeteo_mode: list(always|fallback_only|never)
  prefer_app_forecast: bool
  lookahead_hours: int(1,6)
  sun_model: list(sunshine|irradiance)
  sun_min_awning: int(0,60)
  sun_min_backup: int(0,60)
  sun_min_independent: int(0,60)
  irradiance_min_awning: int(0,1200)
  irradiance_min_backup: int(0,1200)
  irradiance_min_independent: int(0,1200)
  awning_tilt: int(0,90)
  albedo: float(0,0.9)
  min_solar_elevation: float(0,30)
  irradiance_substeps: int(6,60)
  radar_threshold_mmh: float
  radar_tolerance_km: int(0,5)
  radar_fail_safe: bool
  interval_seconds: int(60,3600)
  forecast_max_cache_minutes: int(0,720)
